; -------------------------------------------------------
; Host-side unit tests (no hardware): pio test -e native_test
; Round-trips Packet encoding against the shared field tables
; in ../shared/fields.h that the receiver decodes with.
; -------------------------------------------------------
[env:native_test]
platform = native
build_flags = -std=c++17
