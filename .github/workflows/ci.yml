name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [transmitter, receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-test-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native_test
        working-directory: ${{ matrix.project }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: transmitter, env: node_bme680 }
          - { project: transmitter, env: cc1101_si7021 }
          - { project: receiver, env: esp32-s3-zero }
          - { project: receiver, env: esp32-s3-zero-cc1101 }
          - { project: receiver, env: d1_mini_espota }
          - { project: receiver, env: esp32-s3-zero-bresser }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_flags.py derives VERSION from git describe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-build-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
        working-directory: ${{ matrix.project }}

  # On receiver/v* tags: build installable artifacts for every receiver board
  # and attach them to a GitHub Release. Binaries carry config.h defaults —
  # configure via /settings.html (or /api/config/import) after flashing.
  release:
    if: startsWith(github.ref, 'refs/tags/receiver/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-s3-zero, esp32-s3-zero-cc1101, esp32-s3-zero-bresser,
              esp32-c3-mini, esp32-c3-mini-cc1101, esp32-c3-mini-bresser,
              d1_mini, d1_mini-bresser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-build-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
      - run: pip install platformio
      - name: Build firmware + filesystem + OTA bundle
        working-directory: receiver
        run: |
          pio run -e ${{ matrix.env }}
          pio run -e ${{ matrix.env }} -t buildfs
          pio run -e ${{ matrix.env }} -t otabundle
      - name: Collect artifacts
        working-directory: receiver
        run: |
          mkdir -p ../dist
          for f in firmware.bin littlefs.bin ota_bundle.bin merged.bin; do
            [ -f ".pio/build/${{ matrix.env }}/$f" ] && \
              cp ".pio/build/${{ matrix.env }}/$f" "../dist/${{ matrix.env }}-$f" || true
          done
          ls -la ../dist
      - name: Extract changelog section
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag " " { f=1; next }
            /^## / { f=0 }
            f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md" > release_notes.md
          cat release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
